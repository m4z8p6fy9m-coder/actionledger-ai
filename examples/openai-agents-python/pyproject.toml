[project]
name = "actionledger-python-regression"
version = "0.5.0"
description = "Offline Agents SDK crash-window reproduction for ActionLedger AI"
requires-python = ">=3.11,<3.14"
dependencies = ["openai-agents==0.24.0"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.14.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
